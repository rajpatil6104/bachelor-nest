<!DOCTYPE html>
<!--
  BachelorNest — Supabase "Magic Link" email template, OTP edition.

  HOW TO INSTALL:
  1. Supabase dashboard → Authentication → Email Templates
  2. Select "Magic Link" from the template list
  3. Subject:  Your BachelorNest verification code
  4. Replace the entire "Message body" with this file's contents and Save.

  WHY: signInWithOtp sends whatever this template contains. The default
  template only has {{ .ConfirmationURL }} (a login link). Using {{ .Token }}
  instead makes Supabase send the 6-digit code the app's OTP screen expects.
-->
<html><body style="margin:0;padding:0;background-color:#eef4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef4f4;padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:20px;overflow:hidden;">
<tr><td style="background-color:#04334B;padding:28px 32px;" align="center">
<div style="color:#ffffff;font-size:30px;font-weight:bold;font-family:Arial,Helvetica,sans-serif;">BachelorNest</div>
<div style="color:#42BFBC;font-size:13px;font-weight:bold;letter-spacing:3px;margin-top:8px;">FIND YOUR NEST</div>
</td></tr>
<tr><td style="padding:36px 36px 12px;" align="center">
<h1 style="color:#04334B;font-size:24px;margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;">Your verification code</h1>
<p style="color:#4b5563;font-size:15px;line-height:1.6;margin:0;font-family:Arial,Helvetica,sans-serif;">
Enter this 6-digit code in the app to verify your email:
</p>
<div style="font-size:38px;letter-spacing:14px;font-weight:bold;color:#04334B;background-color:#f0fafa;border-radius:14px;padding:18px 12px 18px 26px;margin:20px 0;font-family:Arial,Helvetica,sans-serif;">{{ .Token }}</div>
<p style="color:#9ca3af;font-size:13px;margin:0;font-family:Arial,Helvetica,sans-serif;">
This code expires soon. If you didn't request this, you can safely ignore this email.
</p>
</td></tr>
<tr><td align="center" style="padding:16px 36px 32px;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#9ca3af;">
— Team BachelorNest 🪹
</td></tr>
</table>
</td></tr>
</table>
</body></html>
